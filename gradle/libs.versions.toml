# Sürümler: hepsi 2024 sonbaharı/kışı yayınlanmış kararlı sürümlerdir.
# Derleme ortamı olmadan doğrulanamadı; ilk derlemeden önce Maven/Google
# Maven deposundan güncel kararlı sürümlerle karşılaştırılmalı.
# Compose BOM, Firebase BOM ve Kotlin/KSP/Compose derleyici uyumu özellikle
# kontrol edilmeli (KSP sürümü Kotlin sürümü ile birebir eşleşmek zorunda).

[versions]
# doğrulanmalı: AGP 8.7.x, Kotlin 2.0.21 ile uyumlu
agp = "8.7.3"
# doğrulanmalı: Kotlin 2.0.21 (K2 derleyici, Compose compiler plugin ile)
kotlin = "2.0.21"
# doğrulanmalı: KSP sürümü "<kotlin>-<ksp>" biçimindedir
ksp = "2.0.21-1.0.28"
# doğrulanmalı: Hilt 2.52, KSP ile uyumlu
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
# doğrulanmalı
composeBom = "2024.12.01"
# doğrulanmalı
activityCompose = "1.9.3"
# doğrulanmalı
navigationCompose = "2.8.4"
# doğrulanmalı
lifecycle = "2.8.7"
# doğrulanmalı
firebaseBom = "33.7.0"
# doğrulanmalı
googleServices = "4.4.2"
# doğrulanmalı
playServicesLocation = "21.3.0"
# doğrulanmalı
mapsCompose = "4.4.1"
# doğrulanmalı
coil = "2.7.0"
# doğrulanmalı
coroutines = "1.9.0"

[libraries]
# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# AndroidX
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Firebase (sürümler BOM üzerinden gelir)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-storage = { group = "com.google.firebase", name = "firebase-storage" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Konum ve harita
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }

# Görsel yükleme
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Coroutines (Firebase Task'ları için play-services modülü dahil)
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
